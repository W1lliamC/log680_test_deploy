name: build
on:
  push:
    branches: [ '*' ]  # Runs on all branches
  pull_request:
    branches: [ '*' ]  # Also runs on PRs
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build and LOAD locally (not pushing)
      - name: Build image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: |
            local/metrics-15:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Save image as tar so integration tests can load the same tested image
      - name: Save image tar
        run: |
          docker save -o image.tar local/metrics-15:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: built-image-${{ github.sha }}
          path: image.tar
          if-no-files-found: error
          retention-days: 1  # Keep artifacts for 1 day to allow integration tests to run