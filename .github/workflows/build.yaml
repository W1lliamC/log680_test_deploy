name: build-test-push
on:
  push:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  # 1) BUILD: build image once, save as artifact
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build and LOAD locally (not pushing)
      - name: Build image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: |
            local/metrics-15:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Save image as tar so next jobs can load the *same tested* image
      - name: Save image tar
        run: |
          docker save -o image.tar local/metrics-15:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: built-image
          path: image.tar
          if-no-files-found: error

  # 2) INTEGRATION TESTS: run Postgres + this image, then pytest
  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    env:
      BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: built-image
          path: .

      - name: Load image
        run: |
          docker load -i image.tar
          docker image ls | grep metrics-15 || true

      - name: Create test network
        run: docker network create ci-net

      - name: Start Postgres (ephemeral test DB)
        run: |
          docker run -d --name pg --network ci-net \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=metrics_test \
            -p 5432:5432 \
            postgres:16
          for i in {1..30}; do
            if docker exec pg pg_isready -U postgres -d metrics_test >/dev/null 2>&1; then
              echo "Postgres is ready"; break
            fi
            echo "Waiting for Postgres..."; sleep 2
          done

      - name: Start API container (image under test)
        run: |
          docker run -d --name api --network ci-net \
            -p 8000:8000 \
            -e POSTGRES_DSN=postgresql+psycopg2://postgres:postgres@pg:5432/metrics_test \
            -e TOKEN_GITHUB="${{ secrets.TOKEN_GITHUB  }}" \
            -e OWNER_GITHUB="${{ secrets.OWNER_GITHUB  }}" \
            -e REPO_GITHUB="${{ secrets.REPO_GITHUB  }}" \
            --entrypoint "" \
            local/metrics-15:${{ github.sha }} \
            uvicorn src.app:app --host 0.0.0.0 --port 8000

          for i in {1..30}; do
            if curl -fsS ${BASE_URL}/health >/dev/null; then
              echo "API is up"; break
            fi
            echo "Waiting for API..."
            sleep 2
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
            docker logs --tail=50 api || true
          done

          curl -fsS ${BASE_URL}/health

      - name: Set up Python for pytest
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test deps
        run: |
          pip install -r requirements.txt

      - name: Run integration tests
        run: pytest tests/integration/ --cov=src --cov-report=term-missing --base-url=${BASE_URL} -v

      - name: Cleanup
        if: always()
        run: |
          docker logs api || true
          docker logs pg || true
          docker rm -f api pg || true
          docker network rm ci-net || true

  # 3) PUSH: only if integration-tests passed; tag & push the *same* image
  push:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: built-image
          path: .

      - name: Load image
        run: docker load -i image.tar

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Compute public tags (latest on main and a build number)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: w1lliamC/metrics-15
          flavor: |
            latest=true
          tags: |
            type=raw,value=build-${{ github.run_number }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
